name: ci

# Valida branches de trabalho e PRs. A `main` e validada pelo `publish`
# (que tambem faz o build da imagem).
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements-bot.txt
      - name: Compilar
        run: python -m compileall -q .
      - name: Smoke test do parser
        run: |
          python - <<'PY'
          from datetime import datetime

          from agenda import parser

          # exemplo de referencia do README
          agora = datetime(2026, 11, 17, 22, 0)
          r = parser.interpretar(
              "me lembre em 18/11 as 8h de tomar remedio, repetir todos os dias", agora
          )
          assert r.tipo == "criar", r
          assert r.primeira.isoformat() == "2026-11-18T08:00:00", r

          # regressao: "todos os dias" deve cair na proxima ocorrencia, nao "amanha"
          agora = datetime(2026, 11, 19, 12, 0)
          r = parser.interpretar("me lembre todos os dias as 18h de tomar remedio", agora)
          assert r.tipo == "criar", r
          assert r.primeira.isoformat() == "2026-11-19T18:00:00", r

          # regressao: recorrencia sem data explicita (caminho do fallback LLM)
          r = parser.de_campos("pagar agua", None, None, "FREQ=MONTHLY;BYMONTHDAY=30", agora)
          assert r.tipo == "criar", r
          assert r.primeira.isoformat() == "2026-11-30T08:00:00", r
          print("parser ok")
          PY

      - name: Grafo de imports do agente
        # Nao roda `python -m agenda` (iniciaria o long-polling); so importa.
        run: python -c "import agenda.bot, agenda.agendador, agenda.runtime; print('imports ok')"

      - name: Smoke test do analista
        # Base fixture em /tmp: ingestao offline -> tools -> guardrails.
        run: |
          python - <<'PY'
          import csv
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          tmp = Path(tempfile.mkdtemp())
          base = tmp / "base.csv"
          cabecalho = ["Id", "data_venda", "vendedor", "equipe", "categoria_servico",
                       "servico", "quantidade", "preco_unitario", "custo", "cliente",
                       "estado", "regiao"]
          linhas = [
              [1, "2024-01-10", "X", "Equipe A", "Consultoria", "Servico 1", 2, 100, 60, "Cliente 1", "SP", "sudeste"],
              [2, "2024-06-05", "Y", "Equipe B", "Desenvolvimento", "Servico 2", 1, 100, 50, "Cliente 2", "RJ", "sudeste"],
              [3, "2023-03-01", "X", "Equipe A", "Consultoria", "Servico 1", 1, 50, 30, "Cliente 1", "SP", "sudeste"],
          ]
          with base.open("w", newline="", encoding="utf-8") as fh:
              escritor = csv.writer(fh)
              escritor.writerow(cabecalho)
              escritor.writerows(linhas)

          destino = tmp / "analista.db"
          subprocess.run(
              [sys.executable, "-m", "analista.ingestao", "--csv", str(base), "--saida", str(destino)],
              check=True,
          )
          os.environ["ANALISTA_DB"] = str(destino)

          from analista import db as basedb, ferramentas

          # receita 2024 = 2*100 + 1*100 = 300; custo 170; margem 130
          r = ferramentas.resumo("2024").linhas[0]
          assert round(r["receita"], 2) == 300.0, r
          assert round(r["custo"], 2) == 170.0, r
          assert round(r["margem"], 2) == 130.0, r
          assert r["vendas"] == 2, r

          # fora de 2024: soma so a linha de 2023
          total = ferramentas.resumo("tudo").linhas[0]
          assert round(total["receita"], 2) == 350.0, total

          # ranking respeita o periodo
          ranking = ferramentas.ranking("equipe", "2024", "receita", 5)
          assert [x["rotulo"] for x in ranking.linhas] == ["Equipe A", "Equipe B"], ranking.linhas

          # guardrails
          try:
              basedb.validar_sql("drop table vendas")
          except basedb.ErroSQL:
              pass
          else:
              raise AssertionError("guardrail nao bloqueou DROP")

          try:
              ferramentas.consultar_sql("select * from sqlite_master")
          except ferramentas.ErroFerramenta:
              pass
          else:
              raise AssertionError("whitelist nao bloqueou sqlite_master")

          # graficos: os quatro tipos desenham, pizza respeita metrica somavel
          from analista import graficos

          recortes = {
              "linha": ferramentas.serie("2024", "mensal", "receita"),
              "barra": ferramentas.ranking("servico", "2024", "receita", 10),
              "comparacao": ferramentas.comparar("2023", "2024"),
              "pizza": ferramentas.ranking("servico", "2024", "receita", 10),
              "rosca": ferramentas.distribuicao("equipe", "2024"),
          }
          for tipo, resultado in recortes.items():
              png = graficos.gerar(resultado, tmp / f"{tipo}.png", tipo=tipo)
              assert png.exists() and png.stat().st_size > 1000, tipo

          assert graficos.pode_pizza(recortes["pizza"]), "pizza devia ser permitida"
          assert not graficos.pode_pizza(recortes["linha"]), "pizza em serie devia ser recusada"

          print("analista ok")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
